theme = '_menus_ttms'
languageCode = 'en-tt'
title = 'MammaMia'
baseURL = 'https://mammamia.ttmenus.com/'
timeout = '300s'

# Mount home, generated menu tree, and theme pages (dashboard, locations, api).
[module]
  [[module.mounts]]
    source = "content/_index.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "content/.generated"
    target = "content"
  [[module.mounts]]
    source = "themes/_menus_ttms/content"
    target = "content"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      attribute = true

[outputFormats]
  [outputFormats.menuitemsJSON]
    mediaType = "application/json"
    baseName = "menu-items"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "JSON"]
  page = ["HTML", "JSON"]

[params]
  tier = "free"
  description = "MammaMia — authentic Italian restaurant and pizzeria at Grand Bazaar, Arima, Maraval, and Valpark. Handmade pasta, wood-fired pizza, and the full Italian experience."
  authServiceUrl = "https://auth.ttmenus.com"
  adsServiceUrl = "https://ads.ttmenus.com"
  notifyServiceUrl = "https://notify.ttmenus.com"

[params.ads]
  clientId = "ttms_mammamia"
  enabled = true
  apiUrl = "https://ads.ttmenus.com/api/v1"

[params.auth]
  enabled = true
  apiUrl = "https://auth.ttmenus.com/api/v1"

[params.reviews]
